name: MoneyPilot AI Telugu Daily Production

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"

permissions:
  contents: read

concurrency:
  group: moneypilot-telugu-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      CHANNEL_NAME: MoneyPilot AI
      CHANNEL_TAGLINE: Understand Money. Build Wealth.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify Telugu font and FFmpeg
        run: |
          ffmpeg -version
          fc-match Telugu

      - name: Generate Telugu videos
        run: python -m app.automation

      - name: Save production files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneypilot-telugu-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
